name: Offline starter checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.8', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check source syntax
        run: python -m py_compile go2_walk.py scripts/check_jetson.py
      - name: Run offline checks
        run: python -m unittest discover -s tests -v
      - name: Check help without ROS
        run: python go2_walk.py --help
